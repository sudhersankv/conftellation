app = "conftellations"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Client-side demo clock; must match the DEMO_NOW secret. `?now=off` in the URL disables it per tab.
  NEXT_PUBLIC_DEMO_NOW = "2026-10-24T13:05:00-07:00"

[env]
  PORT = "3001"
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
